<div
  class="notif-overlay"
  [class.active]="showNotifications"
  (click)="toggleSidebar()"
></div>

<aside
  class="notif-drawer"
  [class.open]="showNotifications"
>

  <div class="notif-header">

    <div>

      <h3>Notifications</h3>

      <span>

        {{ notifications.length }}

        unread messages

      </span>

    </div>

    <button
      class="close-btn"
      (click)="toggleSidebar()"
    >

      <i class="fa fa-times"></i>

    </button>

  </div>

  <div class="notif-body">

    <div
      *ngFor="let note of notifications; let i=index"
      class="notif-card"
    >

      <div class="notif-indicator"></div>

      <div class="notif-icon">

        🔔

      </div>

      <div class="notif-content">

        <div class="notif-top">

          <h5>

            {{ note.header }}

          </h5>

          <span>

            {{ note.timestamp | momentAgo }}

          </span>

        </div>

        <p>

          {{ note.message }}

        </p>

      </div>

      <button
        class="notif-action"
        (click)="markAsRead(i)"
      >

        Got It

      </button>

    </div>

    <div
      *ngIf="notifications.length === 0"
      class="empty-state"
    >

      <img
        [src]="quickNav.emptyDataUrl"
      >

      <h4>

        All Caught Up

      </h4>

      <p>

        No unread notifications.

      </p>

    </div>

  </div>

</aside>
