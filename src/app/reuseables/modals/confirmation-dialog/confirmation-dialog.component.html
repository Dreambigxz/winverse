<div class="confirm-dialog">

  <div class="dialog-icon">

    ⚠️

  </div>

  <div class="dialog-header">

    <h3>

      {{ data.title || 'Confirmation Required' }}

    </h3>

    <p
      [innerHTML]="data.message || 'Are you sure you want to continue with this request?'"
    >

    </p>

  </div>

  <div class="dialog-actions">

    <button
      class="btn-cancel"
      (click)="cancel()"
    >

      Cancel

    </button>

    <button
      class="btn-confirm"
      (click)="confirm()"
    >

      Continue

    </button>

  </div>

</div>
